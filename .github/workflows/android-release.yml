# Builds the signed APK and AAB that a store will accept. Needs three repository secrets,
# which only the owner can set (Settings -> Secrets and variables -> Actions):
#   ANDROID_KEYSTORE_BASE64   - base64 of the PKCS12 upload keystore
#   ANDROID_KEYSTORE_PASSWORD - the password that keystore was created with
#   ANDROID_KEY_ALIAS         - the alias inside it (charguty)
# Keep the keystore file and its password safe: losing them means never being able to
# update the app again under the same package name.
name: Android release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Version shown in the store (e.g. 1.0)
        required: false
        default: "1.0"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: pnpm install --frozen-lockfile

      # apps/game imports these workspace packages from their dist output.
      - run: pnpm --filter @char-guty/game-core --filter @char-guty/shared run build

      - run: pnpm --filter @char-guty/game run build:android

      - name: Restore the upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set - add the repository secrets first."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.p12"

      # gradlew is committed from Windows, so the runner has to be told it is executable.
      - name: Build signed APK and AAB
        working-directory: apps/game/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          # Run number, so each upload outranks the one before it.
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: ${{ inputs.version_name }}
        run: chmod +x gradlew && ./gradlew assembleRelease bundleRelease

      - name: Check the build is not debug-signed
        working-directory: apps/game/android
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME"/build-tools/35.0.0/apksigner verify --print-certs "$APK" | tee certs.txt
          if grep -qi "CN=Android Debug" certs.txt; then
            echo "::error::APK is signed with the debug key - a store will reject it."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: char-guty-release
          path: |
            apps/game/android/app/build/outputs/apk/release/app-release.apk
            apps/game/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
